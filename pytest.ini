[pytest]
addopts = -n auto
testpaths = tests
pythonpath = .
# Переменная для хранения base_url
base_url = http://localhost:8080

[tool.pytest.ini_options]
addopts = [
    "--video", "retain-on-failure",  # Сохранять видео только при падении
    "--screenshot", "only-on-failure" # Сохранять скриншот только при падении
    ]